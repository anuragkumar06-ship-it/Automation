# Cognizant Foundation brand settings for locator maps.
# Every colour and type choice lives here so it can be changed in one place.
# Colours are hex strings. Sizes are matplotlib points unless noted.

font:
  # First family that is actually installed wins. Gellix is the Cognizant
  # brand face; Arial is the fallback the brand guide allows.
  family: [Gellix, Arial, Helvetica, DejaVu Sans]

colours:
  # Base colours. The brand guide is explicit that midnight blue is used for
  # most text instead of black.
  text: "#000048"            # midnight blue - titles and target labels
  text_secondary: "#53565A"  # dark gray - ordinary unit labels
  text_muted: "#97999B"      # medium gray - seas, neighbouring states, footnotes

  # Neutral greys. The guide puts these on "tertiary information such as
  # footnotes or as backgrounds for charts and graphs", which is what the
  # non-target units are.
  unit_fill: "#D0D0CE"       # light gray - non-target states / districts / units
  unit_edge: "#FFFFFF"       # white hairline borders between units
  context_fill: "#E8E8E6"    # a lighter tint, for neighbouring states behind

  # Accent colours. The guide says teal may be used as a general highlight, and
  # that accents suit "secondary headlines, lines, and graphic elements" - which
  # is exactly the target unit and the callout box.
  highlight: "#05819B"       # dark teal, Pantone 2221 C
  highlight_edge: "#03697E"  # a darker rim on the target, so it reads as raised
  highlight_secondary: "#06C7CC"  # medium teal, Pantone 3262 C

  water: "#FFFFFF"           # sea and inland water
  background: "#FFFFFF"
  panel_fill: "#FBFBFA"      # very light panel ground
  panel_edge: "#E4E4E0"      # hairline frame around each panel
  rule: "#000048"            # the rule under the title

  site_marker: "#000048"     # site points
  callout: "#05819B"         # the detail box and the lines to the next panel

line_widths:
  unit_edge: 0.35
  highlight_edge: 0.7
  panel_frame: 0.5
  callout_box: 0.9
  callout_line: 0.6
  title_rule: 1.1
  caption_rule: 0.8
  leader_line: 0.35

type_sizes:
  title: 15
  panel_caption: 9.5
  unit_label: 6
  target_label: 8.5
  context_label: 6.5
  site_label: 7.5
  legend: 7
  scale_bar: 6
  source_line: 5.5

labels:
  # How much to label. "all" labels every unit, "auto" drops units too small to
  # carry a label without a tangle of leader lines, "target_only" labels just
  # the highlighted unit.
  density: auto
  # In auto mode, skip a unit whose drawn size is smaller than this, in points.
  # The target unit and any site are always labelled whatever their size.
  min_size_points: 9.5

markers:
  hospital: o
  school: s
  camp: ^
  default: o
  size: 34

layout:
  # A4 landscape width. The height is worked out from the shapes being drawn.
  figure_width_in: 11.69
  figure_height_in: 6.2       # treated as a maximum, trimmed to fit
  panel_gap_in: 0.62          # space for the lines joining one panel to the next
  margin_in: 0.42

logo:
  # Cognizant Foundation India logo. Two rules from the communication
  # guidelines govern this: the logo always sits in a corner and is never
  # centred, and it is never recoloured, stretched or rotated. The aspect ratio
  # is taken from the file, so it cannot be distorted here.
  #
  # Using the logo needs Cognizant Foundation's approval each time, so this is
  # off by default. Turn it on once you have that approval.
  show: true
  file: assets/cognizant_foundation_india_logo.png
  position: top-right       # top-right, top-left, bottom-right, bottom-left
  width_in: 1.45            # brand minimum for print is 0.6875 in
  clear_space_in: 0.16      # at least the height of the "z" in "cognizant"

rules:
  # Sentence case everywhere, never all caps or title case.
  sentence_case: true
  title_align: left
  # Hard no on decoration, per the brand guide.
  allow_gradients: false
  allow_shadows: false
  allow_dashed_lines: false
  show_logo: false   # superseded by the logo block above
